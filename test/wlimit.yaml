# vim: sw=2:ts=2:et
Server:
  zmq-io-threads: 1
  listen:
    - unix-socket: /tmp/zmqgate-test
  error-log:
    level: 1
  max-websockets: 4

Routing:
    routing: !Prefix ~
    routing-by: !Uri ~
    map:
      "/chat*":
        websocket:
          enabled: yes
          forward: !zmq.Push
          - !zmq.Bind "ipc:///tmp/zmqgate-test-chatfw"
          subscribe: !zmq.Sub
          - !zmq.Bind "ipc:///tmp/zmqgate-test-chat"
          polling-fallback:
            timestamps: yes
