Server:
  zmq-io-threads: 1
  disk-io-threads: 1
  listen:
    - host: 0.0.0.0
      port: 8000
  control:
    socket:
    - !zmq.Bind tcp://*:9000

Routing:
  routing: !Prefix ~
  routing-by: !Uri ~
  map:
    "/ws":
      websocket:
        idle-ping-interval: 0
        enabled: yes
        ignore-missing-connections: yes
        forward:
        - !zmq.Bind "tcp://*:9001"
        subscribe:
        - !zmq.Bind "tcp://*:9002"
